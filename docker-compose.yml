### Main docker-compose file for up services ###
###                 Rediska4445              ###

version: '3.8'

services:
  # Database
  postgres-db:
    image: postgres:16-alpine
    container_name: mizuki-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: mizuka
      POSTGRES_USER: Rediska4445
      POSTGRES_PASSWORD: idontknowthepassword
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U Rediska4445 -d mizuka"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Caching
  redis:
    image: redis:7-alpine
    container_name: mizuki-redis
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru
    restart: unless-stopped
    volumes:
      - redis_data:/data

  # Message Broker
  kafka:
    image: apache/kafka:3.7.0
    container_name: mizuki-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'

  # File storage
  minio:
    image: minio/minio:latest
    container_name: mizuki-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: rootadmin
      MINIO_ROOT_PASSWORD: rootpassword
      MINIO_API_CORS_ALLOW_ORIGIN: "http://localhost:8080"
    volumes:
      - minio_data:/data
    restart: always
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 3s
      timeout: 3s
      retries: 5
    labels:
      org.springframework.boot.readiness-stage: healthy

volumes:
  pgdata:
  minio_data:
  redis_data: