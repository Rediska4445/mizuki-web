spring.application.name=mizuka

spring.datasource.url=jdbc:h2:file:./data/mizukadb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.servlet.multipart.enabled=true
spring.servlet.multipart.file-size-threshold=2MB
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=100MB
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.orm.jdbc.bind=trace

spring.jpa.hibernate.ddl-auto=update

storage.location=data
storage.uploads.tracks.location=data/uploads/tracks
storage.uploads.tracks.pictures.location=data/uploads/tracks/pictures

spring.thymeleaf.cache=false
spring.thymeleaf.check-template-location=true
spring.web.resources.cache.period=0

spring.devtools.restart.enabled=true
spring.devtools.restart.additional-paths=src/main/resources/templates
spring.devtools.restart.exclude=static/**,public/**

spring.devtools.livereload.port=35729
