spring.application.name=mizuka

spring.profiles.active=prod

spring.servlet.multipart.enabled=true
spring.servlet.multipart.file-size-threshold=2MB
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=100MB
spring.jpa.defer-datasource-initialization=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.generate-ddl=true
spring.jpa.show-sql=true

storage.location=data
storage.uploads.tracks.location=data/uploads/tracks
storage.uploads.pictures.location=data/uploads/pictures

spring.thymeleaf.cache=false
spring.thymeleaf.check-template-location=true
spring.web.resources.cache.period=0

spring.devtools.restart.enabled=true
spring.devtools.restart.additional-paths=src/main/resources/templates
spring.devtools.restart.exclude=static/**,public/**

spring.devtools.livereload.port=35729
