# release application settings for Mizuki-web
# created by Rediska4445 of 8.23.2026

# 0. Variables
mizuki.audio.stream = true
mizuki.authors.separator = ,

# 1. Database section

spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.defer-datasource-initialization=true
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/mizuka}
spring.datasource.username=Rediska4445
spring.datasource.password=idontknowthepassword

# 1.1 Database schema section

spring.jpa.generate-ddl=true
spring.jpa.hibernate.ddl-auto=validate

# That shit (migration) aint working
#spring.jpa.properties.hibernate.ddl-auto=none
#spring.jpa.properties.hibernate.hbm2ddl.auto=none

spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# 2. Storage section

minio.url=${MINIO_URL:http://localhost:9000}
minio.endpoint=${MINIO_URL:http://localhost:9000}
minio.public-url=${MINIO_PUBLIC_URL:http://localhost:9000}
minio.accessKey=rootadmin
minio.secretKey=rootpassword
minio.buckets.covers=tracks-covers
minio.buckets.tracks=tracks

# 3. Cache section

spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.cache.type=redis
spring.cache.redis.time-to-live=10m
spring.cache.redis.cache-config.tracks.time-to-live=24h
spring.cache.redis.cache-config.track_sizes.time-to-live=24h

# 4. Brokers section
auto.create.topics.enable=true
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
spring.kafka.consumer.group-id=mizuki-listeners-group
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.max-poll-records=5
spring.kafka.consumer.properties.fetch.max.wait.ms=5000
spring.kafka.consumer.properties.fetch.min.bytes=1
spring.kafka.listener.type=batch
offsets.topic.replication.factor=1
spring.kafka.consumer.properties.spring.json.trusted.packages=rf.mizuka.*
spring.kafka.producer.properties[spring.json.add.type.headers]=true
spring.kafka.consumer.properties[spring.json.value.default.type]=rf.mizuka.web.application.brokers.BaseEvent
spring.kafka.consumer.properties[spring.json.trusted.packages]=rf.mizuka.*

# 4.1 Special settings section
# --- likes ---
mizuki.kafka.likes.max-records=20
mizuki.kafka.likes.max-wait-ms=5000
mizuki.kafka.likes.fetch.min.bytes=1

# --- plays ---
mizuki.kafka.plays.max-records=50
mizuki.kafka.plays.max-wait-ms=10000
mizuki.kafka.plays.fetch.min.bytes=5

# 5. Files
spring.servlet.multipart.enabled=true
spring.servlet.multipart.file-size-threshold=2MB
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=100MB

# 7. Develop
spring.devtools.restart.enabled=true
spring.devtools.restart.additional-paths=src/main/resources/templates
spring.devtools.restart.exclude=static/**,public/**
spring.devtools.livereload.port=35729

# 8. Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.check-template-location=true
spring.web.resources.cache.period=0