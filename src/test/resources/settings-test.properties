spring.profiles.active=test

spring.main.allow-bean-definition-overriding=true

spring.datasource.url=jdbc:h2:mem:mizuka_test_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.cache.type=simple

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

storage.location=${java.io.tmpdir}/mizuka_test/data
storage.uploads.tracks.location=${java.io.tmpdir}/mizuka_test/data/uploads/tracks
storage.uploads.pictures.location=${java.io.tmpdir}/mizuka_test/data/uploads/pictures

spring.flyway.enabled=false
spring.devtools.restart.enabled=false

minio.url=${MINIO_URL:http://localhost:9000}
minio.endpoint=${MINIO_URL:http://localhost:9000}
minio.public-url=${MINIO_PUBLIC_URL:http://localhost:9000}
minio.accessKey=rootadmin
minio.secretKey=rootpassword
minio.buckets.covers=tracks-covers
minio.buckets.tracks=tracks