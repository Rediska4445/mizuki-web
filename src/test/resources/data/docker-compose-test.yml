services:
  postgres-test-db:
    image: postgres:16-alpine
    container_name: mizuki-postgres-test
    command: postgres -p 5435
    ports:
      - "5435:5435"
    environment:
      POSTGRES_DB: mizuka_test
      POSTGRES_USER: Rediska4445
      POSTGRES_PASSWORD: idontknowthepassword
    volumes:
      - pgdata_test:/var/lib/postgresql/data
    restart: always

volumes:
  pgdata_test:
